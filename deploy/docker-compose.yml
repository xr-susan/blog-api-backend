services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      BLOG_STORAGE: postgres
      BLOG_AUTH_SECRET: replace-with-a-long-random-secret
      BLOG_ADMIN_EMAIL: admin@example.com
      BLOG_ADMIN_PASSWORD: replace-before-deploy
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blog_api
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
